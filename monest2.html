<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sikkim Monasteries Map with Street View</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Google Maps JS API (for Street View) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #eaf2fb; /* soft whitish blue */
        color: #1a202c;
      }

      header {
        background: linear-gradient(
          120deg,
          #2563eb 0%,
          #1e40af 40%,
          #38bdf8 70%,
          #6366f1 100%
        );
        background-size: 200% 200%;
        animation: waveHeader 8s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(30, 41, 59, 0.8),
          0 0 40px rgba(15, 23, 42, 0.8);
        padding: 10px 0;
      }
      @keyframes waveHeader {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      header img {
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
      }

      .card img {
        width: 54px;
        height: 54px;
        margin-bottom: 8px;
        box-shadow: 0 2px 8px rgba(30, 41, 59, 0.1);
        border-radius: 50%;
        background: #ffffff; /* same as card bg */
        padding: 7px;
        object-fit: contain;
        border: 2px solid #e2e8f0;
        transition: box-shadow 0.18s, transform 0.18s;
      }

      .hamburger span {
        display: block;
        height: 3px;
        background: #1e293b;
        border-radius: 2px;
      }

      .nav-menu {
        display: none;
        position: absolute;
        top: 60px;
        right: 15px;
        background: #1e293b;
        border-radius: 12px;
        min-width: 170px;
        box-shadow: 0 4px 16px rgba(30, 41, 59, 0.18);
        flex-direction: column;
        z-index: 1000;
      }

      .nav-menu a {
        padding: 10px 15px;
        text-decoration: none;
        color: #f1f5f9;
        font-weight: 600;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: #334155;
        transition: background 0.2s;
      }

      .nav-menu a:last-child {
        border-bottom: none;
      }

      .map-section {
        position: relative;
        margin: 15px;
        border-radius: 12px;
        overflow: hidden;
      }

      #map,
      #street-view {
        height: 400px;
        width: 100%;
        border-radius: 12px;
        margin-bottom: 15px;
        border: 2px solid #d97706;
      }

      .monk-section {
        position: absolute;
        bottom: 15px;
        right: 15px;
        display: flex;
        align-items: flex-start;
        background: transparent;
        z-index: 1000;
      }

      .monk-section img {
        width: 100px;
        height: 100px;
        margin-right: 0px;
      }

      .speech {
        position: relative;
        background: #fff8e1;
        color: #4e342e;
        font-size: 14px;
        padding: 8px 12px;
        border-radius: 12px;
        max-width: 150px;
        line-height: 1.3;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      }

      .speech::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 15px;
        border-width: 8px;
        border-style: solid;
        border-color: #fff8e1 transparent transparent transparent;
      }

      .grid-section {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
        margin: 18px;
      }

      .card {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 18px;
        padding: 22px 200px 12px 200px;
        text-align: center;
        color: #2d2323;
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 1.08rem;
        font-weight: 500;
        border: none;
        box-shadow: 0 8px 32px rgba(30, 41, 59, 0.18),
          0 2px 12px rgba(30, 41, 59, 0.13);
        transition: 0.22s;
        min-width: 120px;
        min-height: 120px;
        max-width: 180px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .card:hover {
        background: #fff;
        box-shadow: 0 16px 48px rgba(30, 41, 59, 0.22),
          0 4px 18px rgba(30, 41, 59, 0.15);
        transform: translateY(-6px) scale(1.04);
      }

      footer {
        display: flex;
        justify-content: center;
        align-items: center;
        background: none;
        padding: 24px 0 0 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          width: 100%;
          padding: 0 12px;
        "
      >
        <!-- Left icon -->
        <img
          src="monastery.png"
          alt="Monastery Icon"
          style="height: 45px; width: 45px"
        />
        <span
          style="
            font-family: 'Dancing Script', 'Poppins', 'Segoe UI', Arial,
              sans-serif;
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #f1f5f9;
            text-shadow: 0 2px 8px rgba(30, 41, 59, 0.13);
            margin-right: auto;
            margin-left: 10px;
          "
          >Sikkim Monasteries & Heritage Map</span
        >
        <!-- Right SIH 2025 logo -->
        <img
          src="sih-logo.jpg"
          alt="SIH 2025 Logo"
          style="height: 45px; width: auto; margin-right: 18px"
        />
      </div>
      <!-- Google Fonts -->
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet"
      />
    </header>

    <div class="map-section">
      <div id="map"></div>
      <div class="monk-section">
        <img src="baba.png" alt="Monk" />
        <div class="speech">
          I'll tell you all the history about this monastery.
        </div>
      </div>
    </div>

    <div class="grid-section">
      <div class="card">
        <img src="foodi.png" alt="Foods" />
        Cultural Foods
      </div>
      <div class="card">
        <img src="dress.png" alt="Dresses" />
        Cultural Dresses
      </div>
    </div>

    <!-- Emergency Card Section -->
    <div
      style="
        display: flex;
        justify-content: center;
        width: 100%;
        margin: 30px 0;
      "
    >
      <div
        class="card emergency-card"
        style="
          background: #fff0f0;
          border: 2px solid #d97706;
          max-width: 350px;
          align-items: center;
          padding-top: 10px;
          padding-bottom: 8px;
        "
      >
        <div
          style="
            font-size: 0.98rem;
            color: #991b1b;
            font-weight: 500;
            margin-bottom: 8px;
            font-family: 'Segoe UI', Arial, sans-serif;
          "
        >
          In case of emergency
        </div>
        <a
          href="emergency.html"
          style="
            display: inline-block;
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            padding: 10px 28px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(220, 38, 38, 0.18);
            letter-spacing: 1px;
            text-decoration: none;
          "
          >EMERGENCY</a
        >
      </div>
    </div>

    <script>
      // Card navigation for Foods, Dresses, Emergency
      document.addEventListener("DOMContentLoaded", function () {
        var cards = document.querySelectorAll(".grid-section .card");
        if (cards[0]) {
          cards[0].style.cursor = "pointer";
          cards[0].addEventListener("click", function () {
            window.location.href = "food.html";
          });
        }
        if (cards[1]) {
          cards[1].style.cursor = "pointer";
          cards[1].addEventListener("click", function () {
            window.location.href = "dress.html";
          });
        }
        // Emergency card
        var emergencyCard = document.querySelector(".emergency-card");
        if (emergencyCard) {
          emergencyCard.style.cursor = "pointer";
          emergencyCard.addEventListener("click", function (e) {
            // Only trigger if not clicking the button inside
            if (e.target.tagName !== 'A') {
              window.location.href = "emergency.html";
            }
          });
        }
      });

      // Leaflet map
      const map = L.map("map").setView([27.533, 88.512], 8);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      const monasteries = [
        { name: "Rumtek Monastery", coords: [27.317, 88.62] },
        { name: "Pemayangtse Monastery", coords: [27.3, 88.233] },
        { name: "Enchey Monastery", coords: [27.34, 88.62] },
        { name: "Tashiding Monastery", coords: [27.416, 88.283] },
      ];

      monasteries.forEach((m) => {
        const marker = L.marker(m.coords).addTo(map);
        marker.bindPopup(`<b>${m.name}</b>`);
        if (m.name === "Rumtek Monastery") {
          marker.on("click", function () {
            window.location.href = "vr1.html";
          });
        }
      });
    </script>
  </body>
</html>
