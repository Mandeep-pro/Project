<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Emergency Contacts — Sikkim</title>

    <!-- Tailwind CDN for quick prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Emergency card (bar) shadow and hover */
      .emergency-bar {
  box-shadow: 0 4px 24px 0 rgba(30,41,59,0.13), 0 1.5px 6px 0 rgba(30,41,59,0.10);
  transition: box-shadow 0.18s cubic-bezier(.4,2,.6,1);
      }
      .emergency-bar:hover {
        box-shadow: 0 10px 32px 0 #b6b6b6, 0 2px 12px rgba(30,41,59,0.18);
      }
      /* Emergency dial button shadow and hover */
      .dial-btn {
  box-shadow: 0 2px 10px 0 rgba(30,41,59,0.13), 0 1.5px 6px 0 rgba(30,41,59,0.10);
  transition: box-shadow 0.18s cubic-bezier(.4,2,.6,1), transform 0.18s cubic-bezier(.4,2,.6,1);
      }
      .dial-btn:hover {
        box-shadow: 0 8px 28px 0 #b6b6b6, 0 2px 12px rgba(30,41,59,0.18);
        transform: scale(1.04);
      }
      :root {
        --police-blue: #0e1f46;
        --police-red: #e11d48;
        --hospital-green: #059669;
        --soft-bg: #f8f4f0;
        --maroon: #7a1f1f;
      }
      body {
        background: var(--soft-bg);
      }
    </style>
  </head>
  <body class="min-h-screen font-sans text-gray-800">
    <!-- Header -->
    <header
      class="bg-gradient-to-r from-rose-700 via-blue-700 to-gray-900 text-white py-7 shadow-lg border-b-4 border-blue-900"
    >
      <div class="max-w-4xl mx-auto px-4 flex items-center justify-between">
        <h1 class="text-lg md:text-2xl font-semibold tracking-wide">
          Emergency Contacts 🚨
        </h1>
        <nav class="text-sm opacity-90">
          <a href="#" class="hover:underline">Home</a>
          <span class="mx-2">•</span>
          <a href="#" class="hover:underline">Monasteries</a>
        </nav>
      </div>
    </header>

    <!-- Contact list -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var homeLink = document.querySelector('header nav a');
        if (homeLink && homeLink.textContent.trim().toLowerCase() === 'home') {
          homeLink.style.cursor = 'pointer';
          homeLink.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'monest2.html';
          });
        }
      });
    </script>
    <main class="max-w-4xl mx-auto px-4 mt-6">
      <ul class="grid grid-cols-1 gap-5">
        <!-- Police Station -->
  <li class="bg-white rounded-xl p-4 shadow-md flex items-center gap-4 emergency-bar">
          <figure
            class="w-28 h-28 rounded-lg overflow-hidden flex-shrink-0 bg-gradient-to-br from-[var(--police-red)] via-[var(--police-blue)] to-white flex items-center justify-center border-2 border-[var(--police-blue)]"
          >
            <img
              src="https://img.icons8.com/ios-filled/100/2563eb/police-badge.png"
              alt="Police Station"
              class="w-20 h-20 object-contain"
            />
          </figure>
          <div class="flex-1">
            <h3 class="text-lg font-semibold text-[var(--maroon)]">
              Nearest Police Station
            </h3>
            <p class="text-sm text-gray-600 mt-1">
              Sadar Police Station, Gangtok, Sikkim
            </p>
            <p class="text-xs text-gray-500 mt-1">Open 24/7</p>
          </div>
          <div class="flex flex-col gap-2 items-end">
            <a
              href="tel:+913592202223"
              class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-gradient-to-r from-[var(--police-red)] to-[var(--police-blue)] text-white text-sm hover:from-blue-800 hover:to-rose-800 dial-btn"
            >
              Call Police
            </a>
          </div>
        </li>

        <!-- Hospital -->
  <li class="bg-white rounded-xl p-4 shadow-md flex items-center gap-4 emergency-bar">
          <figure
            class="w-28 h-28 rounded-lg overflow-hidden flex-shrink-0 bg-gradient-to-br from-[var(--hospital-green)] via-white to-gray-100 flex items-center justify-center border-2 border-[var(--hospital-green)]"
          >
            <img
              src="https://img.icons8.com/ios-filled/100/059669/hospital-3.png"
              alt="Hospital"
              class="w-20 h-20 object-contain"
            />
          </figure>
          <div class="flex-1">
            <h3 class="text-lg font-semibold text-[var(--maroon)]">
              Nearest Hospital
            </h3>
            <p class="text-sm text-gray-600 mt-1">
              STNM Hospital, Sochyagang, Gangtok, Sikkim
            </p>
            <p class="text-xs text-gray-500 mt-1">Emergency: 24/7</p>
          </div>
          <div class="flex flex-col gap-2 items-end">
            <a
              href="tel:+913592231122"
              class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-[var(--hospital-green)] text-white text-sm hover:bg-green-800 dial-btn"
            >
              Call Hospital
            </a>
          </div>
        </li>
      </ul>
    </main>
  </body>
</html>
