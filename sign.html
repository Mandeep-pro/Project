<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Immersive Monastery App — SIGN UP (Prototype)</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --accent: #c94a44;
      }
      .phone {
        max-width: 420px;
        margin-inline: auto;
      }
    </style>
  </head>
  <body
    class="relative bg-gray-100 min-h-screen flex items-center justify-center p-4"
  >
    <!-- full-page background image -->
    <img
      src="darkBG.avif"
      alt="Background"
      class="absolute inset-0 w-full h-full object-cover -z-10"
    />

    <!-- phone like container (keeps shadow above bg) -->
    <main
      class="phone w-full bg-gray-50 rounded-2xl shadow-2xl overflow-hidden border border-gray-200 relative z-10"
    >
      <!-- Top header -->
      <header class="p-6 bg-gray-100 bg-opacity-80">
        <h1 class="text-center text-4xl font-bold text-orange-700">SIGN UP</h1>
      </header>

      <!-- Form card -->
      <section class="p-6 space-y-4">
        <form class="space-y-4">
          <label class="block">
            <input
              type="email"
              placeholder="Email"
              required
              class="w-full px-4 py-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-opacity-50 focus:ring-rose-300 transition"
            />
          </label>

          <label class="block relative">
            <input
              id="password"
              type="password"
              placeholder="Password"
              required
              class="w-full px-4 py-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-opacity-50 focus:ring-rose-300 transition"
            />
            <button
              type="button"
              onclick="togglePassword()"
              aria-label="Toggle password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.6"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.6"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            </button>
          </label>

          <button
            type="submit"
            class="w-full py-4 rounded-2xl text-white font-semibold bg-[#c94a44] hover:bg-[#9c2f2a] transition-colors"
          >
            SIGN UP
          </button>
        </form>

        <p class="text-center text-gray-600">
          Already have an account?
          <a href="login.html" class="text-gray-900 font-medium underline"
            >Login</a
          >
        </p>
        <!-- Images below sign-in form -->
        <div class="grid grid-cols-2 gap-4 pt-2">
          <div
            class="bg-white rounded-xl overflow-hidden flex items-center justify-center p-2 shadow"
          >
            <img
              src="Screenshot 2025-09-24 215832.png"
              alt="Map"
              class="object-cover w-full h-28"
            />
          </div>
          <div
            class="bg-white rounded-xl overflow-hidden flex items-center justify-center p-2 shadow"
          >
            <img
              src="signin2ndimage.jpeg"
              alt="Monastery"
              class="object-cover w-full h-28"
            />
          </div>
        </div>
      </section>
    </main>

    <script>
      function togglePassword() {
        const p = document.getElementById("password");
        if (p) p.type = p.type === "password" ? "text" : "password";
      }

      document.querySelector("form").addEventListener("submit", (e) => {
        e.preventDefault();
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
